# Render Blueprint для UNITY RUST.
# Dashboard → New → Blueprint → вибрати репозиторій → Apply.
#
# Секрети НЕ зберігаються в цьому файлі: sync:false означає, що Render
# попросить ввести значення під час створення сервісу.
services:
  - type: web
    name: unity-rust-nexus
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: RCON_NAME
        value: UNITY ADMIN
      - key: DB_MODE
        value: memory
      - key: SITE_MODE
        value: public
      - key: DAILY_REPORT_HOUR
        value: "18"
      - key: SERVER_QUERY_HOST
        value: 5.199.233.66
      - key: SERVER_QUERY_PORT
        value: "28017"

      # Заповнити в Dashboard → Environment
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RCON_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OWNER_STEAM_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_TICKETS_CHANNEL_ID
        sync: false
      - key: DISCORD_TICKETS_CHANNEL_NAME
        value: admin-tickets
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_ROLE_IDS
        sync: false
      # Необов'язково: тримає free-сервіс (і бота) онлайн 24/7.
      # Значення — публічна адреса сервісу, напр. https://unity-rust.onrender.com
      # - key: KEEPALIVE_URL
      #   sync: false
      - key: PLAYERS_FILE
        sync: false
      - key: DATA_DIR
        sync: false

    # Безкоштовний план не має persistent disk: з DB_MODE=memory база
    # живе в RAM, а скарги/заявки дублюються в Discord (DISCORD_WEBHOOK_URL).
    # Для постійного збереження даних:
    #   plan: starter
    #   disk:
    #     name: nexus-data
    #     mountPath: /var/data
    #     sizeGB: 1
    # і тоді DATA_DIR=/var/data, DB_MODE=file.
